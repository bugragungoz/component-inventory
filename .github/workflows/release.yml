name: Release

# Builds the Windows installers and the extension zip and publishes them as a pre-release, in two
# cases: a tag v1.0.0-beta.N is pushed, or a push to master carries a package.json version that has
# no release yet (the tag v<version> is then created on that commit). So a release is: raise the
# version in a PR and merge it. A tag must match package.json (tools/check-versions.mjs keeps every
# other file in step). Signing is prepared in docs/RELEASING.md and not switched on yet.
on:
  push:
    tags: ['v*']
    branches: [master]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: The version, and whether it needs a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then echo "tag $GITHUB_REF_NAME, package.json says $tag"; exit 1; fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has no release yet; building it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: node tools/check-versions.mjs
      - run: npm run verify
      - run: npx tauri build
      - run: npm run ext:zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Component Inventory ${{ needs.check.outputs.tag }}
          prerelease: ${{ contains(needs.check.outputs.tag, 'beta') }}
          body_path: docs/release-notes.md
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            extension/*.zip
