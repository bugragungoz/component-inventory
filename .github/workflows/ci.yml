name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Checks, unit tests, UI harness, extension (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Versions, tokens, locales, lint, types, unit tests
        run: npm run verify
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Clippy (whole workspace, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Chromium for the harness and the extension
        run: npx playwright-core install --with-deps chromium
      - name: UI checks on the real core
        run: npm run test:ui
      - name: Layout in Turkish, the pseudo-locale, German, Arabic, Chinese and Russian
        run: node tests/ui/visual.mjs
      - name: Extension in Chromium
        run: npm run test:ext
      - name: Extension zip
        run: npm run ext:zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-results
          path: |
            test-results/
            extension/*.zip
          if-no-files-found: ignore

  windows:
    name: Windows build (MSI, NSIS) and the real app in WebView2
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Rust tests on Windows paths
        run: cargo test -p inventory-core
      - name: Unit tests
        run: npx vitest run
      - name: Build the installers
        run: npx tauri build
      - name: Playwright client for the DevTools connection
        run: npx playwright-core --version
      - name: The real app in WebView2
        run: node tests/real-app/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-real-app-screenshots
          path: test-results/real-app/
          if-no-files-found: ignore
