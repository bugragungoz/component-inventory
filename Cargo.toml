[workspace]
members = ["crates/inventory-core", "crates/inventory-bridge", "src-tauri"]
default-members = ["crates/inventory-core", "crates/inventory-bridge", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.4"
edition = "2021"
license = "MIT"
authors = ["bugragungoz"]
repository = "https://github.com/bugragungoz/component-inventory"
rust-version = "1.85"

[workspace.dependencies]
inventory-core = { path = "crates/inventory-core" }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rust_xlsxwriter = { version = "0.99", default-features = false }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
