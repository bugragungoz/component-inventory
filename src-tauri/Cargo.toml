[package]
name = "component-inventory"
description = "Component Inventory desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "component_inventory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
inventory-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# Kept on the minors the owner's laptop already built (see docs/adr/0001-stack.md). deep-link is
# pinned: 2.5 needs tauri 2.12.
tauri = { version = "2.10", features = [] }
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-dialog = "2.6"
tauri-plugin-opener = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
semver = "1"
